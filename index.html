<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Openbanking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <style>
    :root {
      --bg: #f8f8f6;
      --text: #111111;
      --muted: #787874;
      --line: #e7e7e3;
      --soft: #efefec;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --font-sans: 'Urbanist', 'Plus Jakarta Sans', 'Avenir Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      letter-spacing: -0.015em;
      overflow-x: hidden;
    }

    .mono {
      font-family: var(--font-mono);
      letter-spacing: -0.02em;
    }

    /* Return to public landing page from any signed-in workspace */
    .landing-return-trigger{position:fixed;top:20px;left:24px;z-index:61;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--text);cursor:pointer;transition:background .18s var(--ease),transform .18s var(--ease)}
    .landing-return-trigger:hover{background:var(--soft);transform:translateX(-2px)}
    body.public-mode .landing-return-trigger{display:none!important}

    /* Floating Headerless Top-Left Logo & Top-Right Nav Trigger */
    .floating-logo {
      position: fixed;
      top: 24px;
      left: 72px;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--text);
      font-family: var(--font-sans);
    }

    .logo-grid {
      display: grid;
      grid-template-columns: repeat(2, 7px);
      grid-template-rows: repeat(2, 7px);
      gap: 2.5px;
      flex-shrink: 0;
    }
    .logo-sq-solid {
      width: 7px;
      height: 7px;
      background: #111111;
    }
    .logo-sq-hollow {
      width: 7px;
      height: 7px;
      border: 1.4px solid #111111;
      background: transparent;
    }

    .floating-nav-trigger {
      position: fixed;
      top: 20px;
      right: 26px;
      z-index: 60;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      color: var(--text);
      cursor: pointer;
      padding: 0;
      transition: opacity 0.18s var(--ease);
    }
    .floating-nav-trigger:hover {
      opacity: 0.65;
    }

    /* Small Floating Bottom-Left Go Back Icon */
    .floating-back-trigger {
      position: fixed;
      bottom: 24px;
      left: 26px;
      z-index: 60;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      border: 0;
      display: none;
      place-items: center;
      cursor: pointer;
      transition: transform 0.18s var(--ease);
    }
    .floating-back-trigger.visible {
      display: grid;
    }
    .floating-back-trigger:hover {
      transform: translateX(-2px);
    }

    /* Slide-Out Navigation Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.16);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s var(--ease);
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(300px, 88vw);
      background: var(--bg);
      border-left: 1px solid var(--line);
      z-index: 90;
      padding: 24px 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      transform: translateX(102%);
      transition: transform 0.28s var(--ease);
    }
    .nav-sidebar.open {
      transform: translateX(0);
    }

    .nav-group-title {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9b9b96;
      padding: 16px 8px 6px;
      font-weight: 600;
    }

    .nav-link {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      color: #6c6c68;
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: color 0.16s, border-color 0.16s;
    }
    .nav-link:hover,
    .nav-link.active {
      color: #111111;
      border-bottom-color: #111111;
    }

    /* Main Cardless Canvas */
    .canvas-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 82px 4.5vw 76px;
    }

    @media (max-width: 600px) {
      .landing-return-trigger{top:14px;left:14px;width:34px;height:34px}
      .floating-logo {
        top: 18px;
        left: 58px;
      }
      .floating-nav-trigger {
        top: 14px;
        right: 16px;
      }
      .floating-back-trigger {
        bottom: 18px;
        left: 16px;
      }
      .canvas-shell {
        padding: 76px 16px 84px;
      }
    }

    /* Live Admin Broadcast & Enforcement Strip */
    .broadcast-strip {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid #111111;
      border-bottom: 1px solid #111111;
      margin-bottom: 24px;
      font-size: 12.5px;
    }
    .broadcast-strip.visible {
      display: flex;
    }

    .enforcement-strip {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 0;
      border-top: 1px solid #a61b12;
      border-bottom: 1px solid #a61b12;
      margin-bottom: 22px;
      font-size: 12.5px;
      color: #a61b12;
    }
    .enforcement-strip.visible {
      display: flex;
    }

    /* Cardless Hairline Metric Strip */
    .hairline-metrics {
      display: grid;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .hm-cols-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .hm-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .hm-cols-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .hm-cell {
      padding: 20px 20px 20px 0;
      border-right: 1px solid var(--line);
      min-width: 0;
    }
    .hm-cell:not(:first-child) {
      padding-left: 22px;
    }
    .hm-cell:last-child {
      border-right: 0;
    }

    @media (max-width: 920px) {
      .hm-cols-3,
      .hm-cols-4,
      .hm-cols-5 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .hm-cell {
        border-bottom: 1px solid var(--line);
        padding: 16px 14px !important;
      }
      .hm-cell:nth-child(2n) {
        border-right: 0;
      }
    }
    @media (max-width: 520px) {
      .hm-cols-3,
      .hm-cols-4,
      .hm-cols-5 {
        grid-template-columns: 1fr;
      }
      .hm-cell {
        border-right: 0 !important;
        padding: 15px 0 !important;
      }
      .hm-cell:last-child {
        border-bottom: 0;
      }
    }

    .hm-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .hm-value {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.04em;
      color: var(--text);
      margin-top: 6px;
      line-height: 1.1;
    }

    /* Section Header Bar */
    .flat-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }
    .flat-section-head h2 {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
    }

    /* Line-by-Line Horizontal Loading Bars */
    .usage-line-list {
      display: flex;
      flex-direction: column;
      margin-bottom: 38px;
    }
    .usage-line-row {
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }
    .usage-line-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .usage-track {
      width: 100%;
      height: 5px;
      background: transparent;
      border: 1px solid #d4d4ce;
      overflow: hidden;
    }
    .usage-fill {
      height: 100%;
      background: #111111;
      transition: width 0.35s var(--ease);
    }

    /* Flat Buttons & Pill Tabs */
    .ob-btn {
      height: 35px;
      padding: 0 16px;
      border-radius: 20px;
      border: 1px solid #111111;
      background: transparent;
      color: #111111;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.16s, color 0.16s;
    }
    .ob-btn:hover {
      background: var(--soft);
    }
    .ob-btn.solid {
      background: #111111;
      color: #ffffff;
    }
    .ob-btn.solid:hover {
      background: #29292c;
    }
    .ob-btn.subtle {
      border-color: var(--line);
      color: #333330;
    }
    .ob-btn.sm {
      height: 28px;
      padding: 0 12px;
      font-size: 11px;
    }
    .ob-tab {
      height: 28px;
      padding: 0 12px;
      border-radius: 16px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .ob-tab.active {
      border-color: #111111;
      color: #111111;
    }

    /* Direct-on-Screen Table Text Statuses & Inline Actions */
    .st-ok {
      color: #176b3f;
      font-weight: 600;
    }
    .st-warn {
      color: #8a5a00;
      font-weight: 600;
    }
    .st-bad {
      color: #a61b12;
      font-weight: 600;
    }
    .st-neutral {
      color: #111111;
      font-weight: 500;
    }
    .inline-link {
      border: 0;
      background: transparent;
      padding: 0;
      font-size: 12px;
      font-weight: 500;
      color: #111111;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .inline-link:hover {
      opacity: 0.65;
    }
    .inline-link.warn {
      color: #8a5a00;
    }
    .inline-link.danger {
      color: #a61b12;
    }
    .icon-action {
      border: 0;
      background: transparent;
      padding: 3px;
      color: #111111;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      transition: opacity 0.15s;
    }
    .icon-action:hover {
      opacity: 0.6;
    }
    .inline-action-group {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Compact 1-to-2 Line Endpoint Clamp in API Keys Table */
    .ep-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      max-width: 290px;
      min-width: 210px;
      line-height: 1.38;
      font-size: 12px;
    }

    /* Masked Sensitive Value & Institution Sharing ID Inline Layout */
    .masked-wrap,
    .uid-pill-wrap {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .uid-showcase-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      padding: 18px 0;
      border-top: 1px solid #111111;
      border-bottom: 1px solid #111111;
      margin-bottom: 24px;
    }

    /* Direct-on-Screen Bottom-Underline Inputs */
    .ob-search {
      width: min(260px, 100%);
      height: 35px;
      border: 0;
      border-bottom: 1px solid #c9c9c3;
      border-radius: 0;
      background: transparent;
      padding: 6px 2px;
      font-size: 12.5px;
      color: #111111;
      outline: none;
    }
    .ob-search:focus {
      border-bottom-color: #111111;
    }

    .ob-field label {
      display: block;
      font-size: 9.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .ob-field input,
    .ob-field select,
    .ob-field textarea {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #d2d2cc;
      border-radius: 0;
      background: transparent;
      padding: 9px 2px;
      font-size: 13px;
      color: #111111;
      outline: none;
    }
    .ob-field input:focus,
    .ob-field select:focus,
    .ob-field textarea:focus {
      border-bottom-color: #111111;
    }
    .ob-field input[readonly] {
      color: #666662;
    }

    /* Side-by-Side Horizontally Scrollable Flat Tables */
    .flat-table-scroll {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: transparent;
    }
    .flat-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 820px;
    }
    .flat-table th,
    .flat-table td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      font-size: 12.5px;
      white-space: nowrap;
      vertical-align: middle;
    }
    .flat-table th {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
    }
    .flat-table tbody tr:hover {
      background: rgba(17, 17, 17, 0.02);
    }
    .flat-table tbody tr:last-child td {
      border-bottom: 0;
    }

    /* Slide-Over Form & Receipt Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 17, 17, 0.22);
      z-index: 100;
      display: none;
    }
    .modal-backdrop.open {
      display: block;
    }
    .modal-sheet {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(540px, 96vw);
      background: var(--bg);
      border-left: 1px solid var(--line);
      padding: 28px 24px;
      overflow-y: auto;
    }

    .line-pair {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12.5px;
      gap: 12px;
    }

    .toast-bar {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #111111;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 500;
      z-index: 200;
      display: none;
    }
    .toast-bar.show {
      display: block;
    }

    .page-panel {
      display: none;
    }
    .page-panel.active {
      display: block;
    }

    /* Public website, onboarding and independent website editor */
    .public-screen{display:none;position:fixed;inset:0;z-index:120;background:#fbfbf9;color:#111;overflow:auto}
    body.public-mode .public-screen.active{display:block}
    body.public-mode .floating-logo,body.public-mode .floating-nav-trigger,body.public-mode .floating-back-trigger,body.public-mode .drawer-backdrop,body.public-mode .nav-sidebar,body.public-mode .canvas-shell{display:none!important}
    .public-wrap{max-width:1180px;margin:0 auto;padding:26px 5vw 60px}
    .public-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 0 28px;border-bottom:1px solid #e8e8e4}
    .public-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750;letter-spacing:-.04em}

    .public-nav-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .public-btn{border:1px solid #111;background:#111;color:white;padding:11px 17px;border-radius:3px;font-size:12px;font-weight:650;cursor:pointer}
    .public-btn.secondary{background:transparent;color:#111;border-color:#d8d8d2}
    .public-btn.text{background:transparent;color:#555;border:0;padding:9px}

    .public-hero h1{font-size:clamp(42px,7vw,82px);line-height:.99;letter-spacing:-.065em;font-weight:600;margin:0 0 24px;max-width:850px}
    .public-hero p{font-size:17px;line-height:1.65;color:#666;max-width:610px;margin:0 0 30px}
    .public-hero-actions{display:flex;gap:12px;flex-wrap:wrap}
    .public-section{padding:50px 0;border-top:1px solid #e8e8e4}
    .public-section h2{font-size:28px;letter-spacing:-.04em;font-weight:600;margin:0 0 10px}
    .public-section>p{color:#777;max-width:620px;line-height:1.6;margin:0 0 28px;font-size:14px}
    .type-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid #e8e8e4;border-left:1px solid #e8e8e4}

    .flow-wrap{max-width:760px;margin:0 auto;padding:38px 5vw 70px}

    .flow-step{font:11px 'JetBrains Mono',monospace;color:#777}
    .flow-title{font-size:36px;letter-spacing:-.05em;font-weight:600;margin:0 0 8px}.flow-desc{font-size:14px;color:#777;line-height:1.6;margin:0 0 30px}
    .flow-fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}.flow-field{display:flex;flex-direction:column;gap:7px}.flow-field.full{grid-column:1/-1}.flow-field label{font-size:11px;color:#555;font-weight:600}.flow-field input,.flow-field select,.flow-field textarea{width:100%;padding:13px 12px;border:1px solid #deded8;background:#fff;border-radius:2px;font:13px var(--font-sans);outline:none}.flow-field input:focus,.flow-field select:focus,.flow-field textarea:focus{border-color:#111}.flow-note{font-size:11px;color:#888;line-height:1.5;margin-top:18px}.flow-actions{display:flex;justify-content:space-between;gap:12px;margin-top:30px}
    .editor-layout{display:grid;grid-template-columns:310px 1fr;min-height:100vh}.editor-side{border-right:1px solid #e8e8e4;padding:28px 22px}.editor-main{padding:34px 4vw}.editor-field{margin:20px 0;display:flex;flex-direction:column;gap:8px}.editor-field label{font-s
